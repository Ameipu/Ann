<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="hallFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7" />
      <stop offset="100%" stop-color="#F3ECE4" />
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E24AA" />
      <stop offset="100%" stop-color="#5E1473" />
    </linearGradient>
    <linearGradient id="carpetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2185B" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Floor boundary -->
  <rect x="20" y="20" width="960" height="1160" rx="20" fill="url(#hallFloor)" stroke="#D8C8B8" stroke-width="2" />

  <!-- Grid / Decorative accents -->
  <line x1="20" y1="200" x2="980" y2="200" stroke="#EDE4DC" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="20" y1="1020" x2="980" y2="1020" stroke="#EDE4DC" stroke-width="1" stroke-dasharray="8,8" />

  <!-- STAGE (舞台) -->
  <g transform="translate(250, 40)">
    <rect x="0" y="0" width="500" height="110" rx="12" fill="#2E1C2B" stroke="#DFBA75" stroke-width="3" filter="url(#cardShadow)" />
    <text x="250" y="55" fill="#FDFBF7" font-size="28" font-family="'Noto Serif TC', serif, sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="4">婚禮舞台 STAGE</text>
    <text x="250" y="85" fill="#E7CD96" font-size="16" font-family="sans-serif" text-anchor="middle">璀璨幸福 • 緣定今生</text>
  </g>

  <!-- RED CARPET (星光紅毯) -->
  <rect x="440" y="160" width="120" height="840" fill="url(#carpetGrad)" rx="6" opacity="0.85" />
  <line x1="450" y1="170" x2="450" y2="990" stroke="#FFF" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  <line x1="550" y1="170" x2="550" y2="990" stroke="#FFF" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />
  <text x="500" y="580" fill="#FFF" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle" transform="rotate(-90 500 580)" letter-spacing="8" opacity="0.8">✦ 星 光 紅 毯 ✦</text>

  <!-- MASTER TABLE (主桌) -->
  <g id="table-master" transform="translate(500, 240)">
    <circle cx="0" cy="0" r="68" fill="#FCE8EC" stroke="#C2185B" stroke-width="4" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="54" fill="#FFF" stroke="#E91E63" stroke-width="1.5" stroke-dasharray="4,3" />
    <text x="0" y="-8" fill="#AD1457" font-size="24" font-family="'Noto Serif TC', serif, sans-serif" font-weight="bold" text-anchor="middle">主桌</text>
    <text x="0" y="18" fill="#C2185B" font-size="14" font-family="sans-serif" font-weight="bold" text-anchor="middle">新人與至親</text>
  </g>

  <!-- GUEST TABLES (左右兩側) -->
  <!-- Row 1: Table 1 & Table 2 -->
  <g id="table-1" transform="translate(250, 360)">
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#DFBA75" stroke-width="3" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="42" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">01</text>
    <text x="0" y="22" fill="#8D6E63" font-size="12" font-family="sans-serif" text-anchor="middle">男方長輩</text>
  </g>

  <g id="table-2" transform="translate(750, 360)">
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#DFBA75" stroke-width="3" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="42" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">02</text>
    <text x="0" y="22" fill="#8D6E63" font-size="12" font-family="sans-serif" text-anchor="middle">女方長輩</text>
  </g>

  <!-- Row 2: Table 3, Table 4 -->
  <g id="table-3" transform="translate(250, 500)">
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#DFBA75" stroke-width="3" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="42" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">03</text>
    <text x="0" y="22" fill="#8D6E63" font-size="12" font-family="sans-serif" text-anchor="middle">男方親戚</text>
  </g>

  <g id="table-4" transform="translate(750, 500)">
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#DFBA75" stroke-width="3" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="42" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">04</text>
    <text x="0" y="22" fill="#8D6E63" font-size="12" font-family="sans-serif" text-anchor="middle">女方親戚</text>
  </g>

  <!-- Extra outer columns: Table 5, Table 6 -->
  <g id="table-5" transform="translate(100, 430)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#DFBA75" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="38" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">05</text>
    <text x="0" y="20" fill="#8D6E63" font-size="11" font-family="sans-serif" text-anchor="middle">男方貴賓</text>
  </g>

  <g id="table-6" transform="translate(900, 430)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#DFBA75" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="38" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">06</text>
    <text x="0" y="20" fill="#8D6E63" font-size="11" font-family="sans-serif" text-anchor="middle">女方貴賓</text>
  </g>

  <!-- Row 3: Table 7, Table 8 -->
  <g id="table-7" transform="translate(250, 640)">
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#DFBA75" stroke-width="3" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="42" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">07</text>
    <text x="0" y="22" fill="#8D6E63" font-size="12" font-family="sans-serif" text-anchor="middle">新郎大學同學</text>
  </g>

  <g id="table-8" transform="translate(750, 640)">
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#DFBA75" stroke-width="3" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="42" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">08</text>
    <text x="0" y="22" fill="#8D6E63" font-size="12" font-family="sans-serif" text-anchor="middle">新娘大學同學</text>
  </g>

  <!-- Outer columns: Table 9, Table 10 -->
  <g id="table-9" transform="translate(100, 590)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#DFBA75" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="38" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">09</text>
    <text x="0" y="20" fill="#8D6E63" font-size="11" font-family="sans-serif" text-anchor="middle">新郎高中好友</text>
  </g>

  <g id="table-10" transform="translate(900, 590)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#DFBA75" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="38" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">10</text>
    <text x="0" y="20" fill="#8D6E63" font-size="11" font-family="sans-serif" text-anchor="middle">新娘閨蜜死黨</text>
  </g>

  <!-- Row 4: Table 11, Table 12 -->
  <g id="table-11" transform="translate(250, 780)">
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#DFBA75" stroke-width="3" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="42" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">11</text>
    <text x="0" y="22" fill="#8D6E63" font-size="12" font-family="sans-serif" text-anchor="middle">新郎公司同事</text>
  </g>

  <g id="table-12" transform="translate(750, 780)">
    <circle cx="0" cy="0" r="54" fill="#FFFFFF" stroke="#DFBA75" stroke-width="3" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="42" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">12</text>
    <text x="0" y="22" fill="#8D6E63" font-size="12" font-family="sans-serif" text-anchor="middle">新娘公司同事</text>
  </g>

  <!-- Outer columns: Table 13, Table 14 -->
  <g id="table-13" transform="translate(100, 740)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#DFBA75" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="38" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">13</text>
    <text x="0" y="20" fill="#8D6E63" font-size="11" font-family="sans-serif" text-anchor="middle">男方社團夥伴</text>
  </g>

  <g id="table-14" transform="translate(900, 740)">
    <circle cx="0" cy="0" r="48" fill="#FFFFFF" stroke="#DFBA75" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="38" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">14</text>
    <text x="0" y="20" fill="#8D6E63" font-size="11" font-family="sans-serif" text-anchor="middle">女方親朋好友</text>
  </g>

  <!-- Row 5: Table 15, Table 16 -->
  <g id="table-15" transform="translate(250, 910)">
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#DFBA75" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="38" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">15</text>
    <text x="0" y="20" fill="#8D6E63" font-size="11" font-family="sans-serif" text-anchor="middle">工作人員桌</text>
  </g>

  <g id="table-16" transform="translate(750, 910)">
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" stroke="#DFBA75" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="0" cy="0" r="38" fill="#FDFBF7" stroke="#E7CD96" stroke-width="1" stroke-dasharray="3,3" />
    <text x="0" y="2" fill="#5D4037" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">16</text>
    <text x="0" y="20" fill="#8D6E63" font-size="11" font-family="sans-serif" text-anchor="middle">預備桌</text>
  </g>

  <!-- ENTRANCE & FOYER (入口、收禮區、拍照背板) -->
  <g transform="translate(80, 1050)">
    <!-- Reception desk -->
    <rect x="0" y="0" width="220" height="70" rx="8" fill="#E8DCD0" stroke="#B09A85" stroke-width="2" />
    <text x="110" y="42" fill="#4E342E" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">收禮桌 / 簽名處</text>
  </g>

  <!-- Main entrance door arrow -->
  <g transform="translate(420, 1040)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#5D4037" />
    <text x="80" y="36" fill="#FFF" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">宴會廳入口</text>
    <path d="M70,55 L80,45 L90,55" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M80,45 L80,68" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Photo backdrop -->
  <g transform="translate(700, 1050)">
    <rect x="0" y="0" width="220" height="70" rx="8" fill="#F3E5F5" stroke="#BA68C8" stroke-width="2" />
    <text x="110" y="42" fill="#4A148C" font-size="18" font-family="sans-serif" font-weight="bold" text-anchor="middle">📷 拍照背板送客區</text>
  </g>
</svg>
